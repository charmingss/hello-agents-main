[project]
name = "ai-novel-agent"
version = "0.1.0"
description = "Production-oriented Chinese AI novel creation agent"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "temporalio>=1.9,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
pdf = ["pypdf>=5,<6"]
qdrant = ["qdrant-client>=1.13.3,<1.14"]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pyyaml>=6.0,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "testcontainers[postgres]>=4.9,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "external: requires explicitly configured real infrastructure services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["novel_agent"]
